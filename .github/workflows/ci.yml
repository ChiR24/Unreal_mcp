name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (TS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (TypeScript/JavaScript)
        run: |
          echo "Running ESLint 9 (fail on warnings)"
          npx eslint . --max-warnings=0

      - name: Type-check TypeScript
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit

      - name: Verify gateway manifest is in sync
        run: npm run manifest:check

      - name: Parameter combination audit (native parity + strict parameter audit)
        run: |
          echo "test:params first runs the native MCP parity audit (npm run test:native-parity), then the strict parameter audit"
          npm run test:params

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  package-plugin:
    name: Package Plugin (opt-in, requires UE source root)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: lint
    # Opt-in gate: only runs when the UNREAL_ENGINE_ROOT repository variable is set.
    # Hosted CI stays green without it (job is skipped, not failed). The engine
    # root secret is supplied via job/step env (see below), never in `if`.
    if: ${{ vars.UNREAL_ENGINE_ROOT != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package plugin with RunUAT BuildPlugin
        env:
          UNREAL_ENGINE_ROOT: ${{ secrets.UNREAL_ENGINE_ROOT }}
        run: ./scripts/package-plugin.sh "$UNREAL_ENGINE_ROOT" build/plugin-package

  test-matrix:
    name: Test Matrix (Node 20.19 / 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19.x', '26.x']
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (TypeScript/JavaScript)
        run: npx eslint . --max-warnings=0

      - name: Type-check TypeScript
        run: npm run type-check

      - name: Run unit tests
        run: npx vitest run

      - name: Build TypeScript server
        run: npm run build

      - name: Smoke test (mock in-memory MCP)
        run: npm run test:smoke
